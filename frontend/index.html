<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пауком-роботом</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🕷️ Управление пауком-роботом</h1>
        <div id="i2c-status" class="i2c-status"></div>
        
        <!-- Движение -->
        <div class="button-group">
            <h3>Движение</h3>
            <div class="movement-controls">
                <button class="movement-btn forward-btn" onclick="moveForward()">▶️ Вперёд</button>
                <button class="movement-btn forward2-btn" onclick="moveForward2()">▶️ Вперёд 2</button>
                <button class="movement-btn backward-btn" onclick="moveBackward()">◀️ Назад</button>
                <button class="movement-btn left-btn" onclick="moveLeft()">⬅️ Влево</button>
                <button class="movement-btn right-btn" onclick="moveRight()">➡️ Вправо</button>
            </div>
        </div>
        
        <!-- Действия -->
        <div class="button-group">
            <h3>Действия</h3>
            <div class="movement-controls">
                <button class="movement-btn wave-btn" onclick="waveFL()">👋 Помахать FL</button>
                <button class="movement-btn stand-btn" onclick="standUp()">🚶 Встать</button>
                <button class="movement-btn sit-btn" onclick="sitDown()">🪑 Сесть</button>
                <button class="movement-btn pushup-btn" onclick="pushUp()">💪 Отжимание</button>
            </div>
        </div>
        
        <div class="spider-container">
            <!-- Передние ноги -->
            <div class="legs-row front-legs">
                <div class="leg" data-leg="FL">
                    <div class="leg-label">FL</div>
                    <div class="servo" data-leg="FL" data-joint="coxa">
                        <div class="servo-label">coxa</div>
                        <div class="angle-display">
                            <span class="angle-value" id="FL-coxa-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="FL-coxa-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="FL" data-joint="coxa">
                            <button class="apply-btn" onclick="setAngle('FL', 'coxa')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('FL', 'coxa')">Тест</button>
                    </div>
                    <div class="servo" data-leg="FL" data-joint="femur">
                        <div class="servo-label">femur</div>
                        <div class="angle-display">
                            <span class="angle-value" id="FL-femur-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="FL-femur-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="FL" data-joint="femur">
                            <button class="apply-btn" onclick="setAngle('FL', 'femur')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('FL', 'femur')">Тест</button>
                    </div>
                    <div class="servo" data-leg="FL" data-joint="tibia">
                        <div class="servo-label">tibia</div>
                        <div class="angle-display">
                            <span class="angle-value" id="FL-tibia-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="FL-tibia-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="FL" data-joint="tibia">
                            <button class="apply-btn" onclick="setAngle('FL', 'tibia')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('FL', 'tibia')">Тест</button>
                    </div>
                </div>
                
                <div class="leg" data-leg="FR">
                    <div class="leg-label">FR</div>
                    <div class="servo" data-leg="FR" data-joint="coxa">
                        <div class="servo-label">coxa</div>
                        <div class="angle-display">
                            <span class="angle-value" id="FR-coxa-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="FR-coxa-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="FR" data-joint="coxa">
                            <button class="apply-btn" onclick="setAngle('FR', 'coxa')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('FR', 'coxa')">Тест</button>
                    </div>
                    <div class="servo" data-leg="FR" data-joint="femur">
                        <div class="servo-label">femur</div>
                        <div class="angle-display">
                            <span class="angle-value" id="FR-femur-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="FR-femur-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="FR" data-joint="femur">
                            <button class="apply-btn" onclick="setAngle('FR', 'femur')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('FR', 'femur')">Тест</button>
                    </div>
                    <div class="servo" data-leg="FR" data-joint="tibia">
                        <div class="servo-label">tibia</div>
                        <div class="angle-display">
                            <span class="angle-value" id="FR-tibia-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="FR-tibia-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="FR" data-joint="tibia">
                            <button class="apply-btn" onclick="setAngle('FR', 'tibia')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('FR', 'tibia')">Тест</button>
                    </div>
                </div>
            </div>
            
            <!-- Тело паука -->
            <div class="spider-body">
                <div class="body-text">🕷️ ТЕЛО ПАУКА</div>
            </div>
            
            <!-- Задние ноги -->
            <div class="legs-row back-legs">
                <div class="leg" data-leg="BL">
                    <div class="leg-label">BL</div>
                    <div class="servo" data-leg="BL" data-joint="coxa">
                        <div class="servo-label">coxa</div>
                        <div class="angle-display">
                            <span class="angle-value" id="BL-coxa-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="BL-coxa-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="BL" data-joint="coxa">
                            <button class="apply-btn" onclick="setAngle('BL', 'coxa')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('BL', 'coxa')">Тест</button>
                    </div>
                    <div class="servo" data-leg="BL" data-joint="femur">
                        <div class="servo-label">femur</div>
                        <div class="angle-display">
                            <span class="angle-value" id="BL-femur-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="BL-femur-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="BL" data-joint="femur">
                            <button class="apply-btn" onclick="setAngle('BL', 'femur')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('BL', 'femur')">Тест</button>
                    </div>
                    <div class="servo" data-leg="BL" data-joint="tibia">
                        <div class="servo-label">tibia</div>
                        <div class="angle-display">
                            <span class="angle-value" id="BL-tibia-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="BL-tibia-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="BL" data-joint="tibia">
                            <button class="apply-btn" onclick="setAngle('BL', 'tibia')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('BL', 'tibia')">Тест</button>
                    </div>
                </div>
                
                <div class="leg" data-leg="BR">
                    <div class="leg-label">BR</div>
                    <div class="servo" data-leg="BR" data-joint="coxa">
                        <div class="servo-label">coxa</div>
                        <div class="angle-display">
                            <span class="angle-value" id="BR-coxa-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="BR-coxa-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="BR" data-joint="coxa">
                            <button class="apply-btn" onclick="setAngle('BR', 'coxa')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('BR', 'coxa')">Тест</button>
                    </div>
                    <div class="servo" data-leg="BR" data-joint="femur">
                        <div class="servo-label">femur</div>
                        <div class="angle-display">
                            <span class="angle-value" id="BR-femur-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="BR-femur-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="BR" data-joint="femur">
                            <button class="apply-btn" onclick="setAngle('BR', 'femur')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('BR', 'femur')">Тест</button>
                    </div>
                    <div class="servo" data-leg="BR" data-joint="tibia">
                        <div class="servo-label">tibia</div>
                        <div class="angle-display">
                            <span class="angle-value" id="BR-tibia-angle">90</span>°
                        </div>
                        <div class="input-group">
                            <input type="number" class="angle-input" id="BR-tibia-input" 
                                   min="0" max="180" placeholder="0-180" 
                                   data-leg="BR" data-joint="tibia">
                            <button class="apply-btn" onclick="setAngle('BR', 'tibia')">Применить</button>
                        </div>
                        <button class="test-btn" onclick="testServo('BR', 'tibia')">Тест</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
