<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Паук-робот</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="simple-remote">
    <div class="container simple-container">
        <h1>Паук-робот</h1>
        <div id="i2c-status" class="i2c-status"></div>

        <div class="simple-section">
            <h2>Позы</h2>
            <div class="simple-grid simple-grid-2">
                <button class="simple-btn sit-btn" data-action="sit_down">Сесть</button>
                <button class="simple-btn stand-btn" data-action="stand_up">Встать вверх</button>
                <button class="simple-btn stand-base-btn" data-action="stand_base">В базовое</button>
                <button class="simple-btn pushup-btn" data-action="push_up">Отжаться</button>
            </div>
        </div>

        <div class="simple-section">
            <h2>Движение</h2>
            <div class="simple-grid simple-grid-2">
                <button class="simple-btn simple-btn-large forward-btn" data-action="move_forward">
                    Шаг вперёд
                </button>
                <button class="simple-btn simple-btn-large backward-btn" data-action="move_backward">
                    Шаг назад
                </button>
            </div>
            <p class="simple-hint">Назад BL→FR→BR→FL · мах: задние наружу · толчок: передние внутрь, задние в базу</p>
        </div>

        <div class="message" id="message"></div>

        <p class="nav-link"><a href="/calibrate">Калибровка серво →</a></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
